<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro - Crop Predictor</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='seedling.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- <button onclick="window.open('https://www.google.com/search?q=weather+near+me', '_blank')"
     class="weather-btn">🌤</button>-->

<div class="fab-group">

  <!-- chat button -->
  <button id="chatFab" class="fab fab-chat" title="Ask farming questions">
    💬
  </button>
</div>

<!-- Chat panel -->
<div id="chatPanel" class="chat-panel" role="dialog" aria-hidden="true">
  <header>Farmer's Assistant</header>
  <div class="body" id="chatBody">
    <div style="font-size:13px;color:#555;margin-bottom:8px;">Ask about crops, fertilizers, irrigation, pests — keep it concise.</div>
  </div>

  <div style="padding:12px;">
    <textarea id="qInput" placeholder="Type your question (e.g., 'When to sow wheat in Uttar Pradesh?')"></textarea>
    <div class="actions">
      <button class="btn btn-close" id="closeChat">Close</button>
      <button class="btn btn-send" id="sendQ">Ask</button>
    </div>
    <div id="chatStatus" class="chat-loading" style="display:none;">Thinking...</div>
  </div>
</div>

<script>
const chatFab = document.getElementById('chatFab');
const chatPanel = document.getElementById('chatPanel');
const closeChat = document.getElementById('closeChat');
const sendQ = document.getElementById('sendQ');
const qInput = document.getElementById('qInput');
const chatBody = document.getElementById('chatBody');
const chatStatus = document.getElementById('chatStatus');

chatFab.addEventListener('click', () => {
  chatPanel.style.display = chatPanel.style.display === 'block' ? 'none' : 'block';
  chatPanel.setAttribute('aria-hidden', chatPanel.style.display !== 'block');
  qInput.focus();
});

closeChat.addEventListener('click', () => {
  chatPanel.style.display = 'none';
  chatPanel.setAttribute('aria-hidden', 'true');
});

function appendMessage(text, cls='') {
  const d = document.createElement('div');
  d.className = 'chat-msg ' + cls;
  d.textContent = text;
  chatBody.appendChild(d);
  chatBody.scrollTop = chatBody.scrollHeight;
}

sendQ.addEventListener('click', async () => {
  const question = qInput.value.trim();
  if (!question) return;
  appendMessage(question, 'user'); // show user message
  qInput.value = '';
  chatStatus.style.display = 'block';

  try {
    const resp = await fetch('/ask_gpt', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const data = await resp.json();
    if (!resp.ok) {
      appendMessage('Error: ' + (data.error || resp.statusText));
    } else {
      appendMessage(data.answer || "Sorry, I didn't get an answer.");
    }
  } catch (err) {
    appendMessage('Network error: ' + err.message);
  } finally {
    chatStatus.style.display = 'none';
  }
});
</script>

    
</head>
<body>
    <div class="overlay"></div>
    <div class="Main-text">
         <h1>Nice to meet you, myself<span class="italic"> Agro.</span></h1>
    </div>
    </div>
    <div class="container">
        <img src="{{ url_for('static', filename='seedling.png') }}" alt="Form Icon" class="form-image">

        <form action="/predict" method="POST" class="form-box">
            <label for="state">Select Your State:</label>
            <select name="state" id="state" required>
                <option value="">-- Choose A State --</option>
                {% for s in states %}
                    <option value="{{ s }}">{{ s }}</option>
                {% endfor %}
            </select>

            <label for="city">Select Your City:</label>
            <select name="city" id="city" required>
                <option value="">-- Choose A City --</option>
            </select>

            <label>Temperature (°C):</label>
            <input type="number" step="any" name="temperature" placeholder="Enter temperature..." required>

            <label>Humidity (%):</label>
            <input type="number" step="any" name="humidity" placeholder="Enter humidity..." required>

            <label>Rainfall (mm):</label>
            <input type="number" step="any" name="rainfall" placeholder="Enter rainfall..." required>

            <div class="btn-container">
            <button type="submit" class="btn">Predict Crop</button>
            </div>
        </form>
    </div>

    <script>
        const stateSelect = document.getElementById("state");
        const citySelect = document.getElementById("city");

        stateSelect.addEventListener("change", function() {
            const state = encodeURIComponent(this.value.trim());
            citySelect.innerHTML = '<option value="">Loading...</option>';

            if (state) {
                fetch(`/get_cities/${state}`)
                    .then(response => response.json())
                    .then(cities => {
                        citySelect.innerHTML = '<option value="">-- Choose City --</option>';
                        cities.forEach(city => {
                            const option = document.createElement("option");
                            option.value = city;
                            option.textContent = city;
                            citySelect.appendChild(option);
                        });
                    })
                    .catch(error => {
                        console.error("Error fetching cities:", error);
                        citySelect.innerHTML = '<option value="">Error loading cities</option>';
                    });
            }
        });

        
    </script>
</body>
</html>
